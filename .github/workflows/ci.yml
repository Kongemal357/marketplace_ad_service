name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff format --check src/ bin/
      - run: uv run ruff check src/ bin/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run pytest tests/ -v

  build:
      needs: lint
      runs-on: ubuntu-latest
      outputs:
        repo: ${{ steps.repo.outputs.repo }}
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set lowercase repository name
          id: repo
          run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

        - name: Build and push
          uses: docker/build-push-action@v7
          with:
            context: .
            platforms: linux/amd64
            push: true
            tags: ghcr.io/${{ steps.repo.outputs.repo }}:${{ github.sha }}
            no-cache: true
            cache-from: type=gha
            cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Send deploy request
        run: |
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.LMS_API_KEY }}" \
            -d '{"image":"ghcr.io/${{ needs.build.outputs.repo }}:${{ github.sha }}","repository":"${{ github.repository }}"}' \
            https://lms.python-labs.ru/api/deploy-requests)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deployment failed with status code $HTTP_CODE"
            cat response.txt
            exit 1
          fi
  update-outbox-relay:
    needs: [ build, deploy ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Debug kubeconfig
        run: |
          echo "=== File exists ==="
          ls -la ~/.kube/config

          echo "=== File size ==="
          wc -c ~/.kube/config

          echo "=== First lines ==="
          head -5 ~/.kube/config

          echo "=== Current context ==="
          kubectl config current-context

          echo "=== Auth check ==="
          kubectl auth whoami

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update outbox-relay image
        run: |
          kubectl set image deployment/student-kongemal357-marketplace-ad-service-outbox-relay \
            outbox-relay=ghcr.io/${{ needs.build.outputs.repo }}:${{ github.sha }} \
            -n student-kongemal357-marketplace-ad-service

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/student-kongemal357-marketplace-ad-service-outbox-relay \
            -n student-kongemal357-marketplace-ad-service \
            --timeout=120s